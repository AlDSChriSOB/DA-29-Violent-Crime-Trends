name: Verify analysis
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-verified.txt
      - run: python analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-outputs
          path: outputs/
